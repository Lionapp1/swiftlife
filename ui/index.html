<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SwiftLife</title>
<style>
:root{color-scheme:dark;--chrome:#151821;--chrome2:#10131a;--field:#0c0f15;--field2:#171b24;--line:#2b313d;--line2:#353c49;--text:#f5f7fb;--muted:#929bab;--icon:#c2c9d5;--accent:#7658ff;--ok:#59d89b;--warn:#ffc56e}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--chrome2);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}body{border-bottom:1px solid #080a0e}
.chrome{height:76px;padding:10px 12px 9px;background:linear-gradient(180deg,var(--chrome),var(--chrome2));border-bottom:1px solid #252a34;box-shadow:0 5px 20px rgba(0,0,0,.28)}
.row{height:56px;display:flex;align-items:center;gap:6px}.brand{display:flex;align-items:center;gap:9px;min-width:126px;padding:0 7px 0 3px}.logo{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,#805cff,#4e8cff);box-shadow:0 5px 16px rgba(105,86,255,.28)}.logo svg{width:19px;height:19px;fill:none;stroke:white;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.brand-name{font-size:15px;font-weight:800;letter-spacing:-.35px}.brand-sub{font-size:9px;color:#777f8e;margin-top:1px;letter-spacing:.05em;text-transform:uppercase}
.nav{display:flex;align-items:center;gap:2px;margin-right:5px}.btn{width:34px;height:34px;border:1px solid transparent;border-radius:10px;background:transparent;color:var(--icon);display:grid;place-items:center;cursor:pointer;transition:background .12s ease,border-color .12s ease,color .12s ease,transform .08s ease}.btn:hover{background:#242934;border-color:#303744;color:#fff}.btn:active{transform:scale(.94)}.btn:disabled{opacity:.3;cursor:default;transform:none}.btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.address-wrap{height:42px;min-width:180px;flex:1;display:flex;align-items:center;gap:8px;padding:0 12px;background:linear-gradient(180deg,var(--field2),var(--field));border:1px solid var(--line2);border-radius:13px;box-shadow:inset 0 1px 0 rgba(255,255,255,.035),0 2px 9px rgba(0,0,0,.16);transition:border-color .15s ease,box-shadow .15s ease}.address-wrap:focus-within{border-color:#6653c8;box-shadow:0 0 0 3px rgba(118,88,255,.13),inset 0 1px 0 rgba(255,255,255,.04)}.site-icon{width:22px;height:22px;display:grid;place-items:center;color:var(--ok);flex:none}.site-icon svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.address{width:100%;min-width:0;border:0;outline:0;background:transparent;color:#f1f3f8;font-size:14px;font-weight:500;letter-spacing:-.1px}.address::selection{background:#5947b7;color:#fff}.address::placeholder{color:#6f7786}.secure{font-size:10px;color:#6f7887;white-space:nowrap;display:none}.address-wrap:hover .secure{display:block}.loading{width:8px;height:8px;flex:none;border-radius:50%;background:var(--ok);box-shadow:0 0 10px rgba(89,216,155,.45);transition:.15s}.loading.busy{background:var(--warn);box-shadow:0 0 11px rgba(255,197,110,.5);animation:pulse .75s infinite}@keyframes pulse{50%{opacity:.3;transform:scale(.72)}}
.actions{display:flex;align-items:center;gap:3px;margin-left:5px}.download-badge{position:relative}.download-badge:after{content:"";position:absolute;right:4px;top:4px;width:5px;height:5px;border-radius:50%;background:#6f59ff;box-shadow:0 0 7px rgba(111,89,255,.7)}
.menu{position:relative}.menu-panel{position:absolute;right:0;top:43px;width:248px;padding:7px;background:rgba(25,29,37,.98);border:1px solid #353b48;border-radius:14px;box-shadow:0 18px 60px rgba(0,0,0,.5);display:none;z-index:50;backdrop-filter:blur(18px)}.menu-panel.open{display:block}.item{height:38px;width:100%;border:0;border-radius:9px;background:transparent;color:#dfe4ec;display:flex;align-items:center;gap:10px;padding:0 10px;font-size:13px;text-align:left;cursor:pointer}.item:hover{background:#2c323e;color:#fff}.item .ico{width:18px;color:#aeb7c7;text-align:center;font-size:15px}.sep{height:1px;background:#343a46;margin:6px 4px}.meta{padding:8px 10px 5px;color:#70798a;font-size:10px;line-height:1.45}.shortcut{margin-left:auto;color:#656e7e;font-size:10px}
</style>
</head>
<body>
<div class="chrome">
  <div class="row">
    <div class="brand">
      <div class="logo"><svg viewBox="0 0 24 24"><path d="M5 12h10M12 7l5 5-5 5"/></svg></div>
      <div><div class="brand-name">SwiftLife</div><div class="brand-sub">Hızlı web</div></div>
    </div>
    <div class="nav">
      <button class="btn" id="back" title="Geri"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
      <button class="btn" id="forward" title="İleri"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>
      <button class="btn" id="reload" title="Yenile"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.9-3M4 5v5h5M4 13a8 8 0 0 0 14.9 3M20 19v-5h-5"/></svg></button>
      <button class="btn" id="home" title="Ana sayfa"><svg viewBox="0 0 24 24"><path d="M3 11.5L12 4l9 7.5M5.5 10v9h13v-9M9.5 19v-5h5v5"/></svg></button>
    </div>
    <div class="address-wrap">
      <div class="site-icon" id="siteIcon"><svg viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></div>
      <input class="address" id="address" spellcheck="false" autocomplete="off" placeholder="Web adresi veya arama yapın…">
      <span class="secure" id="secure">HTTPS</span>
      <div class="loading" id="loading"></div>
    </div>
    <div class="actions">
      <button class="btn download-badge" id="downloads" title="İndirilenler"><svg viewBox="0 0 24 24"><path d="M12 4v10M8 11l4 4 4-4M5 19h14"/></svg></button>
      <div class="menu">
        <button class="btn" id="menuBtn" title="SwiftLife menüsü"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button>
        <div class="menu-panel" id="menuPanel">
          <button class="item" data-action="focus"><span class="ico">⌕</span><span>Adres çubuğuna odaklan</span><span class="shortcut">Ctrl L</span></button>
          <button class="item" data-action="reload"><span class="ico">↻</span><span>Sayfayı yenile</span><span class="shortcut">Ctrl R</span></button>
          <button class="item" data-action="devtools"><span class="ico">⌘</span><span>Geliştirici araçları</span></button>
          <div class="sep"></div>
          <div class="meta"><b>SwiftLife</b> • Türkçe masaüstü tarayıcısı<br>Sağ tık menüsü: bağlantı, görsel, video ve seçim araçları</div>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
const address=document.getElementById('address'),back=document.getElementById('back'),forward=document.getElementById('forward'),reload=document.getElementById('reload'),home=document.getElementById('home'),loading=document.getElementById('loading'),secure=document.getElementById('secure'),menuBtn=document.getElementById('menuBtn'),menuPanel=document.getElementById('menuPanel'),downloads=document.getElementById('downloads');
const send=o=>{try{window.ipc.postMessage(JSON.stringify(o))}catch(e){}};
const go=()=>{const v=address.value.trim();if(v)send({action:'navigate',url:v})};
address.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();go()}});
address.addEventListener('focus',()=>address.select());
back.onclick=()=>send({action:'back'});forward.onclick=()=>send({action:'forward'});reload.onclick=()=>send({action:'reload'});home.onclick=()=>send({action:'home'});
downloads.onclick=()=>{try{window.open('about:blank','_blank')}catch(e){}};
menuBtn.onclick=e=>{e.stopPropagation();menuPanel.classList.toggle('open')};document.addEventListener('click',e=>{if(!e.target.closest('.menu'))menuPanel.classList.remove('open')});
menuPanel.querySelectorAll('.item').forEach(i=>i.onclick=()=>{menuPanel.classList.remove('open');const a=i.dataset.action;if(a==='focus')swiftlifeFocus();if(a==='reload')send({action:'reload'});if(a==='devtools')send({action:'open_devtools'})});
window.swiftlifeUrl=url=>{if(document.activeElement!==address)address.value=url;const https=/^https:\/\//i.test(url);secure.textContent=https?'HTTPS':'';secure.style.display=https?'block':'none'};
window.swiftlifeTitle=t=>{document.title=(t&&t.trim()?t+' — ':'')+'SwiftLife'};
window.swiftlifeState=(b,f)=>{back.disabled=!b;forward.disabled=!f};
window.swiftlifeLoading=x=>loading.classList.toggle('busy',x);
window.swiftlifeNotice=text=>{statusToast(text)};
window.swiftlifeFocus=()=>{address.focus();address.select()};
function statusToast(text){const old=document.getElementById('swiftlife-toast');if(old)old.remove();const t=document.createElement('div');t.id='swiftlife-toast';t.textContent=text;Object.assign(t.style,{position:'fixed',left:'50%',bottom:'8px',transform:'translateX(-50%)',padding:'8px 12px',border:'1px solid #3a4050',borderRadius:'9px',background:'#1d222c',color:'#dce2eb',fontSize:'11px',zIndex:100,boxShadow:'0 8px 30px rgba(0,0,0,.35)'});document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}
window.swiftlifeFocus();
</script>
</body></html>
