[package]
name = "swiftlife"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "SwiftLife — hızlı, modern ve Türkçe masaüstü web tarayıcısı"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["std"] }
urlencoding = "2"
dirs = "6"
winit = "0.30.13"
wry = "0.56.1"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

# Production build: maximum compiler optimization while keeping the binary portable.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
incremental = false
debug = false
debug-assertions = false
overflow-checks = false
