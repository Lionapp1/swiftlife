[package]
name = "swiftlife"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "SwiftLife — hızlı, modern ve Türkçe masaüstü web tarayıcısı"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
urlencoding = "2"
winit = "0.30.13"
wry = "0.56.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
