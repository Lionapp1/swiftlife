name: SwiftLife C++ Linux CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Native C++ browser build
    runs-on: ubuntu-24.04
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: GTK ve WebKitGTK kur
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: CMake yapılandır
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Derle
        run: cmake --build build --parallel

      - name: Kurulum testi
        run: DESTDIR="$PWD/stage" cmake --install build

      - name: Binary doğrula
        run: test -x stage/usr/local/bin/swiftlife
