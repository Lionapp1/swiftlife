name: SwiftLife C++ Linux CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Native C++ Linux browser + AppImage
    runs-on: ubuntu-24.04
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: GTK ve WebKitGTK kur
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev file wget

      - name: CMake yapılandır
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr

      - name: Derle
        run: cmake --build build --parallel

      - name: Kurulum testi
        run: DESTDIR="$PWD/stage" cmake --install build

      - name: Binary doğrula
        run: |
          test -x stage/usr/bin/swiftlife
          file stage/usr/bin/swiftlife

      - name: AppImage araçlarını indir
        run: |
          mkdir -p appimage-tools
          wget -qO appimage-tools/appimagetool.AppImage https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimage-tools/appimagetool.AppImage

      - name: AppDir oluştur
        run: |
          rm -rf SwiftLife.AppDir
          mkdir -p SwiftLife.AppDir/usr/bin SwiftLife.AppDir/usr/share/applications SwiftLife.AppDir/usr/share/icons/hicolor/scalable/apps
          cp stage/usr/bin/swiftlife SwiftLife.AppDir/usr/bin/swiftlife
          cp packaging/swiftlife.desktop SwiftLife.AppDir/swiftlife.desktop
          cp packaging/swiftlife.desktop SwiftLife.AppDir/usr/share/applications/swiftlife.desktop
          cp packaging/swiftlife.svg SwiftLife.AppDir/swiftlife.svg
          cp packaging/swiftlife.svg SwiftLife.AppDir/usr/share/icons/hicolor/scalable/apps/swiftlife.svg
          cat > SwiftLife.AppDir/AppRun <<'EOF'
          #!/bin/sh
          HERE="$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)"
          export PATH="$HERE/usr/bin:$PATH"
          exec "$HERE/usr/bin/swiftlife" "$@"
          EOF
          chmod +x SwiftLife.AppDir/AppRun

      - name: AppImage oluştur
        env:
          ARCH: x86_64
        run: |
          NO_STRIP=1 ./appimage-tools/appimagetool.AppImage SwiftLife.AppDir SwiftLife-x86_64.AppImage

      - name: AppImage doğrula
        run: |
          test -s SwiftLife-x86_64.AppImage
          file SwiftLife-x86_64.AppImage
          chmod +x SwiftLife-x86_64.AppImage
          ./SwiftLife-x86_64.AppImage --appimage-version

      - name: AppImage artifact yükle
        uses: actions/upload-artifact@v4
        with:
          name: SwiftLife-Linux-x86_64-AppImage
          path: SwiftLife-x86_64.AppImage
          if-no-files-found: error
