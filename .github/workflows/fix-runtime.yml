name: Fix runtime script

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix generated toolbar script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/main.rs')
          s = p.read_text()
          old = "const url=q('#url'),dot=q('#dot'),https=q('#https),menu=q('#menu'),ctx=q('#ctx');"
          new = "const url=q('#url'),dot=q('#dot'),https=q('#https'),menu=q('#menu'),ctx=q('#ctx');"
          if old not in s:
              raise SystemExit('expected runtime-script typo not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Validate Linux
        uses: dtolnay/rust-toolchain@stable
      - name: Cargo check
        run: cargo check
      - name: Commit fix and remove one-shot workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.rs .github/workflows/fix-runtime.yml
          git commit -m "fix: repair toolbar runtime script" 
          git push
