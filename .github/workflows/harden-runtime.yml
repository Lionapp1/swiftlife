name: Harden runtime

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Apply runtime hardening
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/main.rs')
          s = p.read_text(encoding='utf-8')
          old = 'dpi::{LogicalSize, PhysicalPosition, PhysicalSize},'
          new = 'dpi::{LogicalPosition, LogicalSize, PhysicalSize},'
          s = s.replace(old, new)
          old = 'fn bounds(window: &Window) -> Rect { let size = window.inner_size(); Rect { position: PhysicalPosition::new(0i32, 0i32).into(), size: PhysicalSize::new(size.width, size.height).into() } }'
          new = '''fn bounds(window: &Window) -> Rect {
              let size = window.inner_size();
              let scale = window.scale_factor().max(0.5);
              let logical = LogicalSize::new(size.width as f64 / scale, size.height as f64 / scale);
              Rect {
                  position: LogicalPosition::new(0.0, 0.0).into(),
                  size: logical.into(),
              }
          }'''
          if old not in s:
              raise SystemExit('bounds pattern not found')
          s = s.replace(old, new)
          old = '.with_devtools(false).with_initialization_script_for_main_only(init, true)'
          new = '.with_devtools(false).with_background_color((245, 246, 248, 255)).with_initialization_script_for_main_only(init, true)'
          if old not in s:
              raise SystemExit('builder pattern not found')
          s = s.replace(old, new)
          old = 'WindowEvent::Resized(_) => self.update_layout(), WindowEvent::CloseRequested'
          new = 'WindowEvent::Resized(_) | WindowEvent::ScaleFactorChanged { .. } => self.update_layout(), WindowEvent::CloseRequested'
          if old not in s:
              raise SystemExit('resize pattern not found')
          s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify
        run: cargo check

      - name: Commit changes and remove one-shot workflow
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/main.rs
          git rm .github/workflows/harden-runtime.yml
          git diff --cached --quiet && exit 0
          git commit -m "perf: harden native webview layout"
          git push origin HEAD:main
