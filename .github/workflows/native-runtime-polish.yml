name: Native runtime polish

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux WebKitGTK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Apply native layout and runtime fixes
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/main.rs')
          s = p.read_text(encoding='utf-8')
          original = s
          s = s.replace('dpi::{LogicalSize, PhysicalPosition, PhysicalSize},', 'dpi::{LogicalSize, PhysicalPosition, PhysicalSize},')
          old = 'fn bounds(window: &Window) -> Rect { let size = window.inner_size(); Rect { position: PhysicalPosition::new(0i32, 0i32).into(), size: PhysicalSize::new(size.width, size.height).into() } }'
          new = '''fn bounds(window: &Window) -> Rect {
        let size = window.inner_size();
        let scale = window.scale_factor().max(0.5);
        let logical = LogicalSize::new(size.width as f64 / scale, size.height as f64 / scale);
        Rect { position: PhysicalPosition::new(0i32, 0i32).into(), size: logical.into() }
    }'''
          s = s.replace(old, new)
          s = s.replace('.with_devtools(false).with_initialization_script_for_main_only(init, true)', '.with_devtools(false).with_background_color((245, 246, 248, 255)).with_initialization_script_for_main_only(init, true)')
          s = s.replace('WindowEvent::Resized(_) => self.update_layout(), WindowEvent::CloseRequested', 'WindowEvent::Resized(_) => self.update_layout(), WindowEvent::ScaleFactorChanged { .. } => self.update_layout(), WindowEvent::CloseRequested')
          s = s.replace('while gtk::events_pending() { gtk::main_iteration_do(false); }', 'while gtk::events_pending() { gtk::main_iteration_do(false); }')
          if s == original:
              raise SystemExit('No expected native layout changes matched')
          p.write_text(s, encoding='utf-8')
      - name: Check
        run: cargo check
      - name: Commit and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/main.rs
          git rm .github/workflows/native-runtime-polish.yml
          git commit -m "perf: harden native webview layout"
          git push origin HEAD:main
