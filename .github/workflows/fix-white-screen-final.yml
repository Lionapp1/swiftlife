name: Fix white screen final
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch startup
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/main.rs')
          s = p.read_text()
          s = s.replace('    dpi::{LogicalPosition, LogicalSize, PhysicalPosition, PhysicalSize},', '    dpi::{LogicalSize, PhysicalPosition, PhysicalSize},')
          s = s.replace('        let browser_proxy = proxy.clone(); let init = chrome_script();', '        let browser_proxy = proxy.clone();')
          s = s.replace('.with_bounds(Self::bounds(&window)).with_url(&start_url)', '.with_bounds(Self::bounds(&window)).with_url("about:blank")')
          s = s.replace('.with_background_color((245, 246, 248, 255)).with_initialization_script_for_main_only(init, true)', '.with_background_color((245, 246, 248, 255))')
          old = '        let browser = builder.build_as_child(window.as_ref()).expect("SwiftLife web görünümü oluşturulamadı");\n        self.window = Some(window); self.browser = Some(browser); self.web_context = Some(web_context); self.update_layout(); self.push_state();'
          new = '''        let browser = builder.build_as_child(window.as_ref()).expect("SwiftLife web görünümü oluşturulamadı");
        self.window = Some(window); self.browser = Some(browser); self.web_context = Some(web_context);
        self.send_script(&chrome_script());
        self.navigate(&start_url);
        self.update_layout(); self.push_state();'''
          if old not in s:
              raise SystemExit('startup block not found')
          s = s.replace(old, new)
          old2 = 'AppEvent::Loading(is_loading) => { self.send_script(if is_loading { "window.swiftlifeLoading&&window.swiftlifeLoading(true);" } else { "window.swiftlifeLoading&&window.swiftlifeLoading(false);" }); self.push_state(); }'
          new2 = '''AppEvent::Loading(is_loading) => {
                if is_loading {
                    self.send_script("window.swiftlifeLoading&&window.swiftlifeLoading(true);");
                } else {
                    self.send_script(&chrome_script());
                    self.send_script("window.swiftlifeLoading&&window.swiftlifeLoading(false);");
                }
                self.push_state();
            }'''
          if old2 not in s:
              raise SystemExit('loading block not found')
          s = s.replace(old2, new2)
          p.write_text(s)
          PY
      - name: Cargo check
        run: cargo check
      - name: Commit and clean temporary workflows
        shell: bash
        run: |
          git config user.name "swiftlife-bot"
          git config user.email "actions@github.com"
          git add src/main.rs
          git rm -f .github/workflows/fix-white-screen-final.yml || true
          git rm -f .github/workflows/fix-webview-white-v2.yml .github/workflows/fix-webview-white.yml .github/workflows/fix-unused-import.yml .github/workflows/fix-runtime.yml 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: isolate webview startup from remote page"
          git push
