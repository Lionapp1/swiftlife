name: Fix WebView startup path

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Patch WebView host and startup script
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/main.rs')
          s = p.read_text()
          replacements = [
            ('dpi::{LogicalPosition, LogicalSize, PhysicalPosition, PhysicalSize}', 'dpi::LogicalSize'),
            ('    fn bounds(window: &Window) -> Rect {\n        let size = window.inner_size();\n        Rect {\n            position: PhysicalPosition::new(0i32, 0i32).into(),\n            size: PhysicalSize::new(size.width, size.height).into(),\n        }\n    }\n', '    #[cfg(target_os = "linux")]\n    fn bounds(window: &Window) -> Rect {\n        let size = window.inner_size().to_logical::<u32>(window.scale_factor());\n        Rect {\n            position: winit::dpi::LogicalPosition::new(0u32, 0u32).into(),\n            size: winit::dpi::LogicalSize::new(size.width, size.height).into(),\n        }\n    }\n'),
            ('        let browser_proxy = proxy.clone(); let init = chrome_script();\n', '        let browser_proxy = proxy.clone();\n'),
            ('.with_id("swiftlife-browser").with_bounds(Self::bounds(&window)).with_url(&start_url)', '.with_id("swiftlife-browser").with_url(&start_url)'),
            ('.with_background_color((245, 246, 248, 255)).with_initialization_script_for_main_only(init, true).with_download_started_handler(', '.with_background_color((245, 246, 248, 255)).with_download_started_handler('),
            ('        let browser = builder.build_as_child(window.as_ref()).expect("SwiftLife web görünümü oluşturulamadı");', '        let browser = builder.build(window.as_ref()).expect("SwiftLife web görünümü oluşturulamadı");'),
            ('AppEvent::Loading(is_loading) => { self.send_script(if is_loading { "window.swiftlifeLoading&&window.swiftlifeLoading(true);" } else { "window.swiftlifeLoading&&window.swiftlifeLoading(false);" }); self.push_state(); }', 'AppEvent::Loading(is_loading) => { if is_loading { self.send_script("window.swiftlifeLoading&&window.swiftlifeLoading(true);"); } else { let script = chrome_script(); self.send_script(&script); self.send_script("window.swiftlifeLoading&&window.swiftlifeLoading(false);"); } self.push_state(); }'),
            ('impl App { fn update_layout(&self) { if let (Some(window), Some(browser)) = (&self.window, &self.browser) { let _ = browser.set_bounds(Self::bounds(window)); } } }', 'impl App { fn update_layout(&self) { #[cfg(target_os = "linux")] if let (Some(window), Some(browser)) = (&self.window, &self.browser) { let _ = browser.set_bounds(Self::bounds(window)); } } }'),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'missing source segment: {old[:100]}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Cargo check
        run: cargo check
      - name: Commit fix and remove temporary workflows
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.rs
          git rm .github/workflows/fix-webview-white-v2.yml .github/workflows/fix-webview-white.yml .github/workflows/fix-unused-import.yml
          git commit -m "fix: use host webview sizing and defer chrome injection"
          git push
