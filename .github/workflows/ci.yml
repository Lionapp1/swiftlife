name: SwiftLife CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  optimize-runtime:
    name: Runtime performance optimization
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Runtime optimizasyonlarını uygula
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('src/main.rs')
          text = path.read_text(encoding='utf-8')
          original = text

          old = '''    fn save_history(&mut self, url: &str) { if url.is_empty() || url == "about:blank" || url == self.last_history_url { return; } self.last_history_url = url.to_string(); let Some(path) = history_path() else { return }; if let Some(parent) = path.parent() { let _ = fs::create_dir_all(parent); } let stamp = SystemTime::now().duration_since(UNIX_EPOCH).map(|d| d.as_secs()).unwrap_or_default(); let line = serde_json::json!({"visited_at": stamp, "url": url}).to_string(); if let Ok(mut file) = OpenOptions::new().create(true).append(true).open(path) { let _ = writeln!(file, "{line}"); } if let Some(session) = session_path() { let _ = fs::write(session, url); } }'''
          new = '''    fn save_history(&mut self, url: &str) {
        if url.is_empty() || url == "about:blank" || url == self.last_history_url { return; }
        self.last_history_url = url.to_string();
        let url = url.to_string();
        std::thread::spawn(move || {
            let Some(path) = history_path() else { return };
            if let Some(parent) = path.parent() { let _ = fs::create_dir_all(parent); }
            let stamp = SystemTime::now().duration_since(UNIX_EPOCH).map(|d| d.as_secs()).unwrap_or_default();
            let line = serde_json::json!({"visited_at": stamp, "url": url}).to_string();
            if let Ok(mut file) = OpenOptions::new().create(true).append(true).open(path) { let _ = writeln!(file, "{line}"); }
            if let Some(session) = session_path() { let _ = fs::write(session, url); }
        });
    }'''
          if old in text:
              text = text.replace(old, new, 1)

          text = text.replace('.with_devtools(true)', '.with_devtools(false)')

          old_load = '''.with_on_page_load_handler({ let proxy = browser_proxy.clone(); move |event, url| { let _ = proxy.send_event(AppEvent::Loading(matches!(event, PageLoadEvent::Started))); let _ = proxy.send_event(AppEvent::UrlChanged(url)); } })'''
          new_load = '''.with_on_page_load_handler({ let proxy = browser_proxy.clone(); move |event, _url| { let _ = proxy.send_event(AppEvent::Loading(matches!(event, PageLoadEvent::Started))); } })'''
          text = text.replace(old_load, new_load, 1)

          old_loading = '''AppEvent::Loading(is_loading) => { self.send_script(if is_loading { "window.swiftlifeLoading&&window.swiftlifeLoading(true);" } else { "window.swiftlifeLoading&&window.swiftlifeLoading(false);" }); self.push_state(); }'''
          new_loading = '''AppEvent::Loading(is_loading) => { self.send_script(if is_loading { "window.swiftlifeLoading&&window.swiftlifeLoading(true);" } else { "window.swiftlifeLoading&&window.swiftlifeLoading(false);" }); }'''
          text = text.replace(old_loading, new_loading, 1)

          text = text.replace('backdrop-filter:blur(18px)', 'backdrop-filter:none')

          if 'SwiftLife runtime performance patch: 2026-09-05' not in text:
              text = text.replace('fn chrome_script() -> String {', '// SwiftLife runtime performance patch: 2026-09-05\nfn chrome_script() -> String {', 1)

          if text != original:
              path.write_text(text, encoding='utf-8')
          else:
              print('Runtime optimizations already applied.')

      - name: Değişiklikleri main dalına gönder
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/main.rs; then
            echo 'Runtime source already optimized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.rs
          git commit -m 'perf: remove runtime navigation stalls'
          git push origin HEAD:main

  check:
    name: Cargo check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: optimize-runtime
    if: always() && (needs.optimize-runtime.result == 'success' || needs.optimize-runtime.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Linux WebKitGTK bağımlılıklarını kur
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev

      - name: Rust kur
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo check
        run: cargo check

  linux-appimage:
    name: Linux AppImage
    runs-on: ubuntu-24.04
    needs: check
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: WebKitGTK bağımlılıklarını kur
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev

      - name: Rust kur
        uses: dtolnay/rust-toolchain@stable

      - name: Release derlemesi
        run: cargo build --release

      - name: AppImage oluştur
        shell: bash
        run: |
          set -euo pipefail
          rm -rf AppDir SwiftLife-x86_64.AppImage
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/scalable/apps
          cp target/release/swiftlife AppDir/usr/bin/swiftlife
          cp packaging/swiftlife.desktop AppDir/usr/share/applications/swiftlife.desktop
          cp packaging/swiftlife.svg AppDir/usr/share/icons/hicolor/scalable/apps/swiftlife.svg
          cp packaging/swiftlife.desktop AppDir/swiftlife.desktop
          cp packaging/swiftlife.svg AppDir/swiftlife.svg
          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          HERE="$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)"
          exec "$HERE/usr/bin/swiftlife" "$@"
          EOF
          chmod +x AppDir/AppRun AppDir/usr/bin/swiftlife
          curl -L --fail --retry 3 -o appimagetool.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool.AppImage
          ARCH=x86_64 ./appimagetool.AppImage AppDir SwiftLife-x86_64.AppImage

      - name: AppImage artifactını yükle
        uses: actions/upload-artifact@v4
        with:
          name: SwiftLife-Linux-x86_64
          path: SwiftLife-x86_64.AppImage
          if-no-files-found: error
