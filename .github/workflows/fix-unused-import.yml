name: Fix unused import

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove unused LogicalPosition import
        run: sed -i 's/dpi::{LogicalPosition, LogicalSize, PhysicalPosition, PhysicalSize}/dpi::{LogicalSize, PhysicalPosition, PhysicalSize}/' src/main.rs
      - name: Verify
        run: cargo check
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.rs
          git rm .github/workflows/fix-unused-import.yml
          git commit -m "fix: remove unused LogicalPosition import"
          git push
