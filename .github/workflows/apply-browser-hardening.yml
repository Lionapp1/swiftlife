name: Apply browser hardening

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Apply changes
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('src/main.rs')
          s = p.read_text()
          if 'mod security;' not in s:
              s = s.replace('use std::{', 'mod security;\n\nuse std::{', 1)
          s = s.replace('move |url| { let _ = proxy.send_event(AppEvent::UrlChanged(url)); true }', 'move |url| { if security::navigation_allowed(&url) { let _ = proxy.send_event(AppEvent::UrlChanged(url)); true } else { false } }', 1)
          s = s.replace('if let Some(dir) = &download_dir { if let Some(name) = path.file_name() { *path = dir.join(name); } } path.is_absolute()', 'if let Some(dir) = &download_dir { if let Some(name) = path.file_name().and_then(|n| n.to_str()) { *path = dir.join(security::safe_download_name(name)); } } path.is_absolute()', 1)
          old = 'if value.starts_with("http://") || value.starts_with("https://") || value.starts_with("file://") { return value.to_string(); }'
          new = 'if value.starts_with("http://") || value.starts_with("https://") { return value.to_string(); } if value.contains(\':\') && !value.contains(\' \') { return format!("https://www.google.com/search?q={}", urlencoding::encode(value)); }'
          s = s.replace(old, new, 1)
          p.write_text(s)
          Path('src/security.rs').write_text('''use std::path::Path;\n\npub fn navigation_allowed(url: &str) -> bool {\n    let lower = url.trim().to_ascii_lowercase();\n    lower.starts_with("https://") || lower.starts_with("http://") || lower == "about:blank"\n}\n\npub fn safe_download_name(name: &str) -> String {\n    let base = Path::new(name).file_name().and_then(|v| v.to_str()).unwrap_or("download");\n    let cleaned: String = base.chars().map(|c| if c.is_control() || matches!(c, \'/\' | \'\\\\\' | \':\' | \'*\' | \'?\' | \'"\' | \'<\' | \'>\' | \'|\') { \'_\' } else { c }).collect();\n    let cleaned = cleaned.trim_matches(\'.\').trim();\n    if cleaned.is_empty() { "download".into() } else { cleaned.chars().take(180).collect() }\n}\n''')
          PY
      - name: Verify
        run: cargo check
      - name: Commit and remove workflow
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/main.rs src/security.rs
          git rm .github/workflows/apply-browser-hardening.yml
          git commit -m "perf: apply browser hardening pass"
          git push origin HEAD:main
