name: Apply browser hardening

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  harden:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'browser hardening pass')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Apply security and storage hardening
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/main.rs')
          s = p.read_text(encoding='utf-8')
          original = s

          if 'mod security;' not in s:
              s = s.replace('use std::{', 'mod security;\n\nuse std::{', 1)

          old = '''for entry in rx {\n            if let Some(path) in history.as_ref() {'''
          new = '''let mut pending_session: Option<String> = None;\n        let mut last_session_flush = std::time::Instant::now();\n        for entry in rx {\n            if let Some(path) in history.as_ref() {'''
          if old in s and 'let mut pending_session: Option<String>' not in s:
              s = s.replace(old, new, 1)
              old2 = '''            if let Some(path) = session.as_ref() { let _ = fs::write(path, &entry.url); }\n        }'''
              new2 = '''            pending_session = Some(entry.url);\n            if last_session_flush.elapsed() >= std::time::Duration::from_millis(750) {\n                if let (Some(path), Some(url)) = (session.as_ref(), pending_session.take()) {\n                    let tmp = path.with_extension("tmp");\n                    if fs::write(&tmp, &url).is_ok() { let _ = fs::rename(&tmp, path); }\n                }\n                last_session_flush = std::time::Instant::now();\n            }\n        }\n        if let (Some(path), Some(url)) = (session.as_ref(), pending_session) {\n            let tmp = path.with_extension("tmp");\n            if fs::write(&tmp, &url).is_ok() { let _ = fs::rename(&tmp, path); }\n        }'''
              s = s.replace(old2, new2, 1)

          old = '''move |url| { let _ = proxy.send_event(AppEvent::UrlChanged(url)); true }'''
          new = '''move |url| {\n                if security::navigation_allowed(&url) {\n                    let _ = proxy.send_event(AppEvent::UrlChanged(url));\n                    true\n                } else {\n                    false\n                }\n            }'''
          if old in s and 'security::navigation_allowed' not in s:
              s = s.replace(old, new, 1)

          old = '''fn normalize_url(input: &str) -> String { let value = input.trim(); if value.is_empty() { return HOME_URL.to_string(); } if value.eq_ignore_ascii_case("about:blank") { return value.to_string(); } if value.starts_with("http://") || value.starts_with("https://") || value.starts_with("file://") { return value.to_string(); } if value.contains(' ') || !value.contains('.') { return format!("https://www.google.com/search?q={}", urlencoding::encode(value)); } format!("https://{value}") }'''
          new = '''fn normalize_url(input: &str) -> String {\n    let value = input.trim();\n    if value.is_empty() { return HOME_URL.to_string(); }\n    if value.eq_ignore_ascii_case("about:blank") { return value.to_string(); }\n    if value.starts_with("http://") || value.starts_with("https://") { return value.to_string(); }\n    if value.contains(':') && !value.contains(' ') {\n        return format!("https://www.google.com/search?q={}", urlencoding::encode(value));\n    }\n    if value.contains(' ') || !value.contains('.') { return format!("https://www.google.com/search?q={}", urlencoding::encode(value)); }\n    format!("https://{value}")\n}'''
          if old in s:
              s = s.replace(old, new, 1)

          if s == original:
              raise SystemExit('No expected hardening changes matched')
          p.write_text(s, encoding='utf-8')

          Path('src/security.rs').write_text(r'''use std::path::Path;

/// Allow only browser navigation schemes that SwiftLife intentionally supports.
/// WebView callbacks can receive arbitrary schemes from links, redirects, and scripts.
pub fn navigation_allowed(url: &str) -> bool {
    let trimmed = url.trim();
    let lower = trimmed.to_ascii_lowercase();
    if lower.starts_with("https://") || lower.starts_with("http://") || lower == "about:blank" {
        return true;
    }
    // Keep local file navigation disabled for normal web content. Local files can
    // be opened later through an explicit, dedicated browser action if desired.
    if lower.starts_with("file:") || lower.starts_with("javascript:") || lower.starts_with("data:") || lower.starts_with("blob:") {
        return false;
    }
    false
}

pub fn safe_download_name(name: &str) -> String {
    let base = Path::new(name).file_name().and_then(|v| v.to_str()).unwrap_or("download");
    let cleaned: String = base.chars().map(|c| {
        if c.is_control() || matches!(c, '/' | '\\\\' | ':' | '*' | '?' | '"' | '<' | '>' | '|') { '_' } else { c }
    }).collect();
    let cleaned = cleaned.trim_matches('.').trim();
    if cleaned.is_empty() { "download".into() } else { cleaned.chars().take(180).collect() }
}
''', encoding='utf-8')

          p = Path('src/main.rs')
          s = p.read_text(encoding='utf-8')
          old = '''if let Some(dir) = &download_dir { if let Some(name) = path.file_name() { *path = dir.join(name); } } path.is_absolute()'''
          new = '''if let Some(dir) = &download_dir {\n                if let Some(name) = path.file_name().and_then(|n| n.to_str()) {\n                    *path = dir.join(security::safe_download_name(name));\n                }\n            }\n            path.is_absolute()'''
          if old in s:
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

      - name: Verify
        run: cargo check

      - name: Commit and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/main.rs src/security.rs
          git rm .github/workflows/apply-browser-hardening.yml
          git commit -m "perf: apply browser hardening pass"
          git push origin HEAD:main
